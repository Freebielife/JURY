<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d21"><meta name="description" content="JURY Observatory — сделки STON.fi и DeDust, держатели и подтверждённые сжигания JURY в сети TON.">
<title>Jury Token Observatory</title><style>:root{color-scheme:light;--ink:#101721;--muted:#536372;--paper:#f8fafc;--line:#cbd5df;--blue:#30a1f5;--link:#075d9b;--night:#090b0e;--graphite:#10151c;--green:#1e6b51;--red:#df0000;--orange:#975019;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--night)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{margin:0;background:var(--night)}
.wrap{width:min(1220px,calc(100% - 64px));margin-inline:auto}
h1,h2,h3,p{margin:0}
a{color:var(--link);text-underline-offset:3px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,summary:focus-visible,#plot svg:focus-visible{outline:3px solid #5692db;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#090b0ef5;border-bottom:1px solid #283541;color:#f5f8fc}
.nav,.brand,nav,.langs,.tabs,.smallTabs,.introLinks,.eyebrow,.sectionHeading,.chartCaption,footer,.graphTop{display:flex;align-items:center}
.nav{min-height:65px;gap:20px;justify-content:space-between}
.brand{gap:9px;color:#fff;text-decoration:none}
.brand svg{width:36px;height:36px}
.brand strong{font-size:19px;letter-spacing:-.055em}
.brand span{font-weight:500;color:#c3cbd5}
.brand:hover{text-decoration:none}
nav{gap:5px}
nav a,.langs button{font-size:14px;font-weight:650}
nav a{color:#b4c0ce;padding:9px 11px;text-decoration:none;border-radius:8px}
nav a.on,nav a:hover{color:white;background:#203347;text-decoration:none}
.langs,.tabs,.smallTabs{background:#e5edf4;border-radius:10px;padding:3px;gap:2px;width:fit-content;max-width:100%;flex-wrap:wrap}
.langs button,.tabs button,.smallTabs button{border:none;padding:7px 10px;background:transparent;color:#364c61;border-radius:7px;line-height:1.35}
.langs .on,.tabs .on,.smallTabs .on{background:#114c79;color:white}
.hero{margin:20px 0 16px;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;min-height:192px;border-radius:20px;border:1px solid #293746;background:radial-gradient(ellipse at 88% 70%,#153650 0%,transparent 53%),#0b0d10;color:#fff}
.herotext{position:relative;z-index:1;padding:27px clamp(20px,3vw,44px);max-width:66%}
.eyebrow,.tag,footer>span{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:650;letter-spacing:.09em}
.eyebrow{gap:8px}
.eyebrow i{width:7px;height:7px;background:#468ec6;border-radius:50%}
.hero .eyebrow{color:#b9c9d9}
.hero .eyebrow i{background:var(--blue)}
h1{font-size:clamp(38px,4.6vw,68px);letter-spacing:-.07em;line-height:1.05;margin:7px 0 8px}
h1 em{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:-.055em;color:#a1d6ff}
.hero p{color:#c9d5e1;font-size:15px}
.heroArt{position:absolute;inset:0 0 0 auto;width:41%;display:grid;align-items:center;pointer-events:none}
.heroArt svg{width:100%;height:100%;max-height:250px}
.introLinks{margin-top:17px;gap:10px}
.introLinks a,.more{border:1px solid #9daebf;border-radius:8px;padding:7px 12px;text-decoration:none;font-weight:650;font-size:14px}
.introLinks a{color:#f0f6ff;border-color:#536779}
.introLinks a:first-child{color:#081624;background:var(--blue);border-color:var(--blue)}
.introLinks a:hover,.more:hover{box-shadow:inset 0 0 0 1px currentColor}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:clamp(16px,2vw,25px);min-width:0}
.graphTop,.sectionHeading,footer{justify-content:space-between;gap:12px}
.graphTop{align-items:flex-start}
.graph .eyebrow{color:#b6c8d9}
.graph .eyebrow span{color:#7891a7}
.graph h2{font-weight:550;color:var(--muted);font-size:16px;margin-top:12px}
.price{font-size:clamp(27px,3.2vw,44px);line-height:1.12;letter-spacing:-.05em;font-variant-numeric:tabular-nums;font-weight:730}
.chartCaption{font-size:13px;color:var(--muted);gap:7px;margin-top:13px}
.lineKey{width:17px;height:3px;border-radius:3px;background:var(--blue)}
.sep{color:#6f8196}
#plot{margin:6px 0;min-height:183px}
#plot svg{width:100%;height:183px;display:block;touch-action:pan-y}
#plot text{font:11px system-ui,sans-serif;fill:#b6c6d6}
.marker{cursor:pointer}
.marker:focus{outline:2px solid var(--orange)}
#readout{font-size:14px;font-variant-numeric:tabular-nums;min-height:24px;color:var(--ink)}
.note,.description,.resources p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:12px}
.description{margin:8px 0}
.summary{margin:18px 0 22px}
.summary h2,.panel h2:not(.graph h2){font-size:clamp(20px,2.1vw,27px);letter-spacing:-.045em;line-height:1.2}
.summary .sectionHeading{margin-bottom:9px}
.tag{color:#3e5061;background:#e2ebf4;border-radius:20px;padding:4px 9px;white-space:nowrap;font-weight:500;letter-spacing:.02em}
#stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 15px;min-width:0}
.stat b,.stat small,.stat span{display:block}
.stat b{font-size:clamp(20px,2.1vw,31px);line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.04em}
.stat small{font-size:13px;color:var(--muted)}
.stat span{font-size:14px;font-weight:670}
.buy{color:var(--green)}
.sell{color:var(--red)}
.burn{color:var(--orange)}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.columns .tabs{margin:10px 0}
.columns .tabs button,.smallTabs button{font-size:14px}
.smallTabs:not(:empty){margin-bottom:8px}
#feedNote,#rankNote{margin-bottom:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid #dce3eb;padding:10px 0;align-items:center}
.row>div{min-width:0}
.row>div:last-child{text-align:right}
.row b,.row small{display:block;font-variant-numeric:tabular-nums}
.row small{color:var(--muted);font-size:13px}
.row a{overflow-wrap:anywhere}
.row b{font-size:15px;line-height:1.45}
.row .badge{display:inline-block;padding:1px 6px;font-size:12px;border-radius:5px;margin-right:6px}
.badge.buy{background:#e0f3e8}
.badge.sell{background:var(--red);color:white}
.badge.burn{background:#ffead4}
.position{color:var(--muted);font:12px ui-monospace,monospace;margin-right:8px}
.empty{padding:16px 0;color:var(--muted)}
.more{background:#eaf1f7;color:#144b72}
.more[hidden]{display:none}
#more{margin-top:8px;width:100%}
.resources{margin:20px 0}
.resourcesGrid{display:grid;grid-template-columns:1.15fr 1.2fr 1fr;gap:24px;margin-top:16px}
.resources h3{font-size:16px;margin-bottom:6px}
.resourceList{display:flex;gap:8px 13px;flex-wrap:wrap}
.resourceList,.contract{margin-top:8px;font-size:14px}
.contract{display:block;overflow-wrap:anywhere;font-family:ui-monospace,monospace;margin-bottom:10px}
.resourcesGrid article{min-width:0}
summary{cursor:pointer;font-weight:600}
footer{padding:16px 0 25px}
footer a{font-size:14px}
@media(max-width:800px){.wrap{width:calc(100% - 28px)}
.nav{display:grid;grid-template-columns:1fr auto;gap:0;padding-top:6px}
.langs{grid-column:2;grid-row:1}
.brand{grid-column:1;grid-row:1}
nav{grid-column:1/-1;justify-content:space-between;gap:0}
nav a{padding:7px 5px;font-size:13px}
html{scroll-padding-top:98px}
.columns{grid-template-columns:1fr}
.heroArt{width:35%;opacity:.82}
.herotext{max-width:73%;padding:19px}
.hero{min-height:180px}
.graphTop{flex-wrap:wrap}
.resourcesGrid{grid-template-columns:1fr 1fr}

#stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.wrap{width:calc(100% - 20px)}
.hero{margin-top:10px}
.herotext{max-width:100%;padding:16px}
.heroArt{width:35%;inset:auto 0 0 auto;height:78px}
.hero p{max-width:96%;font-size:14px}
.introLinks{max-width:76%;gap:6px;flex-wrap:wrap}
.introLinks a{font-size:13px;padding:6px 8px}
.graphTop{gap:10px}
.tabs button{padding:6px 8px}
.stat{padding:10px}
.stat small{font-size:12px}
.row{gap:3px}
.row b{font-size:14px}
.row small{font-size:12px}
.resourcesGrid{grid-template-columns:1fr;gap:15px}
.resourcesGrid article+article{border-top:1px solid var(--line);padding-top:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.walletLegend{font-size:13px;color:var(--muted);margin:4px 0}
.walletIdentity{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px;max-width:100%;vertical-align:baseline}
.row .walletAddress{font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.row .walletAddress.buy,.walletRole.buy{color:#126042}
.row .walletAddress.sell,.walletRole.sell{color:#df0000}
.row .walletAddress.burn,.walletRole.burn{color:#874305}
.row .walletAddress.neutral{color:#51615c}
.walletRole{font-size:11px;font-weight:600}
:is(.row,.walletResult) .domainBadge{font:600 11px/1.4 system-ui,sans-serif;letter-spacing:0;padding:2px 6px;border-radius:5px;overflow-wrap:anywhere;max-width:100%;display:inline-block}
.domainBadge.digits{color:#482e00;background:linear-gradient(110deg,#ffcc00 12%,#ffe173 34%,#fff9c0 46%,#ffd700 57%,#efb000 84%);background-size:220% 100%;border:1px solid #a37b00;animation:projectGold 4s ease-in-out infinite alternate}
details.domainDetails{display:inline-block;border:0;padding:0;font-size:12px;font-weight:500;width:100%}
details.domainDetails summary{color:var(--muted);font-size:11px}
#rank .position{vertical-align:top}
.onlyBadges{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin:4px 0 7px;cursor:pointer}
.onlyBadges input{width:16px;height:16px;accent-color:var(--link)}


@keyframes projectGold{from{background-position:0% 50%}
to{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){.domainBadge.digits{animation:none}}
footer>span{color:#f5f8ff}
footer a{color:#dcebf8}
.price{overflow-wrap:break-word}

/* Make the chart and header dark; financial rows retain their semantic colours. */
.langs,.graph .tabs{background:#202a35}
.langs button,.graph .tabs button{color:#c3cfdb}
.langs .on,.graph .tabs .on{background:var(--blue);color:#071421}
.graph{--ink:#f5f8fc;--muted:#b2c0cd;color:var(--ink);background:var(--graphite);border-color:#283747}
.graph #readout a{color:#86caff}
.graph #plot svg{height:205px}
.brand:hover,.introLinks a:hover{color:#fff}
.introLinks a:first-child:hover{color:#081624}

.wrap{width:min(1180px,calc(100% - 88px))}
.hero{background:linear-gradient(165deg,#080a0d 22%,#10151c 100%)}
.graph,.summary{background:linear-gradient(180deg,#10151c,#152332);border:1px solid #374b5b}
.summary{background:linear-gradient(180deg,#152332,#172b3c);padding:clamp(16px,2vw,25px);border-radius:17px;color:#f4f8ff}
.summary .sectionHeading{margin-bottom:14px}
.stat{background:linear-gradient(145deg,#131d28,#1e3041);border:1px solid #3d5363}
.stat small{color:#b9c8d5}
.stat span.buy,.stat span.sell,.stat span.burn{display:inline-block;border-radius:5px;background:linear-gradient(120deg,#d8e5eb,#c1d4df);padding:1px 6px}
.columns .panel,.resources{--ink:#f3f7fc;--muted:#c1cedb;--link:#a6daff;--line:#435a6a;color:var(--ink);border-color:#3b5264}
.columns .panel{background:linear-gradient(180deg,#172b3c,#1a3b51)}
.columns .tabs,.columns .smallTabs{background:#0e1c29}
.columns .tabs button,.columns .smallTabs button{color:#cbd9e7}
.columns .tabs .on,.columns .smallTabs .on{background:#265a7d;color:#fff}
.row{border-color:#435666}
.position{color:#c1cedb}
.tag{background:#233f54;color:#d1e6f6}
.row .walletIdentity{background:linear-gradient(125deg,#d8e5eb,#c1d4df);border-radius:7px;padding:3px 6px}
.domainDetails summary{color:#354d62!important}
.domainDetails span{color:#223847}
#more,.resourceList>a,.resourceList>button{color:#f3f8ff;background:#15496b;border:1px solid #6289a3}
.resources{background:linear-gradient(180deg,#1a3b51,#20475e);padding:clamp(18px,2.5vw,30px)}
.resourcesGrid{grid-template-columns:1.3fr 1fr;gap:clamp(14px,2vw,26px)}
.resourcesGrid article{border-top:1px solid #7190a3;padding-top:13px}
.resources h3{margin-bottom:10px}
.resourceList{display:grid;grid-template-columns:1fr;gap:7px}
.resourceList>a,.resourceList>button{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;padding:8px 12px;border-radius:7px;text-align:left;font:650 14px/1.35 system-ui,sans-serif;text-decoration:none;cursor:pointer}
.resourceList>a:hover,.resourceList>button:hover,#more:hover{background:#1b5c82;border-color:#aedfff}
.resources .contract{color:#d1e4f2;margin:6px 0;word-break:break-all}
footer{background:#090c10;border-top:1px solid #405362;padding:14px 18px;margin-bottom:14px;border-radius:8px}
@media(min-width:1000px){.resourcesGrid article:first-child .resourceList{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.wrap{width:calc(100% - 34px)}.resourcesGrid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.wrap{width:calc(100% - 22px)}.resourcesGrid{grid-template-columns:1fr}.resourcesGrid article+article{border-color:#7190a3}}

/* Draw external-link arrows without relying on a font glyph. */
.resourceList>a::after,.introLinks a[href^="https:"]::after,.row a:not(.walletAddress)::after{content:"";display:inline-block;width:8px;height:8px;flex-shrink:0;margin-left:6px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;background:linear-gradient(135deg,transparent 43%,currentColor 46%,currentColor 54%,transparent 57%);vertical-align:1px}

.syncBar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 12px;padding:12px 18px;background:#101b27;border:1px solid #374b5b;border-radius:12px;color:#e5f1fb}
.syncBar>div{min-width:0}.syncBar p{font-size:14px;font-weight:650}.syncBar small{display:block;color:#b9c8d5;font-size:12px;overflow-wrap:anywhere}.syncBar .syncWarning{color:#ffcf80}
#refreshData{flex-shrink:0;min-height:42px;padding:8px 14px;border:1px solid #6289a3;border-radius:7px;background:#15496b;color:#f3f8ff;font-weight:650;font-size:14px}#refreshData:hover{background:#1b5c82}#refreshData:disabled{opacity:.65;cursor:wait}
@media(max-width:400px){.syncBar{align-items:flex-start;flex-wrap:wrap;padding:12px 14px}.syncBar>div{flex:1 1 175px}}

/* Market cap: native-currency valuation, with an explicit estimation note. */
.graph .price{font-size:clamp(32px,4.2vw,52px);letter-spacing:-.055em;line-height:1.15}
.graph h2{font-size:15px;margin-top:12px;margin-bottom:7px}
.capHeadline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.capChange{font:700 14px/1.3 system-ui,sans-serif;padding:6px 9px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.capChange:empty{display:none}.capPositive{color:#54edb6;background:#133c32;border:1px solid #24634e}.capNegative{color:#ff2020;background:#321419;border:1px solid #7a242a}
#capPeriod{margin-top:5px;color:#a4b9cb}.graph #plot{min-height:250px;margin:18px 0 8px}.graph #plot svg{height:250px}
.graph #plot text{font:11px system-ui,sans-serif;fill:#b8c9d6}
.capRange{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#adc3d3;font-size:12px;font-variant-numeric:tabular-nums;margin:0 0 13px}
.graph #readout{background:#0b1723;border:1px solid #2b4354;padding:10px 12px;border-radius:9px;min-height:43px;font-size:13px;margin-bottom:9px}
.capMethod{font-size:11px;line-height:1.5;color:#9db3c4;border-top:1px solid #2b4354;padding-top:10px;margin-top:10px;max-width:850px}
.graph .chartCaption .lineKey{background:var(--chart-colour,#38dda0)}
@media(max-width:500px){.graph .price{font-size:34px}.capHeadline{gap:8px}.graph .graphTop{gap:15px}.graph .tabs{width:100%;justify-content:space-between}.graph .tabs button{padding:8px 6px;font-size:12px}.graph #plot svg{height:240px}.graph #plot{min-height:240px}.graph #readout{font-size:12px}.capMethod{font-size:11px}}

body{background:radial-gradient(ellipse at 78% 0%,#24347b 0%,#111c49 28%,transparent 55%),#070d21}
header{background:#0a1129f5;border-color:#324576}
.brandMark{width:36px;height:36px;border-radius:50%;background:var(--project-art) center/cover}
.hero{min-height:268px;border-color:#435b9c;background:radial-gradient(ellipse at 78% 50%,#2b4696 0%,#182860 34%,transparent 68%),linear-gradient(112deg,#0d1639,#111c49)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#7eaeff 1px,transparent 1.5px),radial-gradient(circle,#eff7ff 1px,transparent 1.5px);background-size:43px 53px,83px 71px;background-position:0 0,26px 32px;opacity:.24;pointer-events:none}
.heroArt{width:40%;height:100%;background:var(--project-art) center / auto 88% no-repeat;filter:drop-shadow(0 0 20px #60b5ff60);border-radius:50%}
.hero h1 em{color:#89ceff}
.graph{background:linear-gradient(180deg,#101936,#151f43);border-color:#394b80}
.summary{background:linear-gradient(180deg,#182649,#202d55);border-color:#435480}
.columns .panel{background:linear-gradient(180deg,#192847,#1e3659)}
.resources{background:linear-gradient(180deg,#192b4b,#1b345a)}
.graphControls{display:grid;gap:10px;justify-items:end;min-width:0}
.row.trade-buy{border-left:3px solid #4cce9f;padding-left:8px;background:#14564832}
.row.trade-sell{border-left:3px solid #fb6b76;padding-left:8px;background:#7c223532}
.row.trade-burn{border-left:3px solid #e7ae57;padding-left:8px}
@media(max-width:800px){.graphControls{justify-items:start}}
@media(max-width:590px){
 .hero{min-height:210px}.heroArt{width:32%;height:auto;inset:12px 12px auto auto;aspect-ratio:1;opacity:1;background-size:contain}
 .herotext{max-width:76%}.hero h1{font-size:clamp(32px,7.5vw,47px)}.hero h1 em{display:block}
 .hero p{max-width:100%}.introLinks{max-width:100%}.graphControls{width:100%}.graph #currency{display:flex;width:auto}
}

#activity,#wallets,#pools{background:#141b27;border-color:#303a4a}
#activity .row,#wallets .row{background:transparent;border-color:#303a4a;border-left:0;padding-left:0}
#activity .row .walletIdentity,#wallets .row .walletIdentity{background:none;padding:0;column-gap:6px;row-gap:4px}
.columns .walletIdentity .walletAddress{background:none;padding:0}
.columns .row .walletAddress{color:#d6e2f0}
.columns .walletRole.buy,.columns .badge.buy{color:#85e6bc;background:none}
.columns .walletRole.sell,.columns .badge.sell{color:#ff9a9f;background:none}
.columns .walletRole.burn,.columns .badge.burn{color:#f1bd7d;background:none}
.columns .domainDetails summary,.columns .domainDetails span{color:#becbd9!important}
.columns :is(.row,.walletResult) .projectBadges{display:flex;flex-wrap:wrap;gap:5px;width:100%;align-items:center}
.columns :is(.row,.walletResult) .projectBadge{--badge-edge:#53627b;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--badge-edge);border-radius:6px;background:#202939;text-decoration:none;color:#eaf1fb;font:650 11px/1.35 system-ui,sans-serif;min-height:26px;max-width:100%}
.columns :is(.row,.walletResult) .projectBadge:hover{text-decoration:underline}
.columns :is(.row,.walletResult) .projectBadge::after{display:none}
.projectBadge img{display:block;width:18px;height:18px;object-fit:contain;border-radius:3px}
.columns :is(.row,.walletResult) .projectBadge.staking{padding-inline:4px;--badge-edge:#6c93cb}
.columns :is(.row,.walletResult) .projectBadge.vnuk{--badge-edge:#8f606f;color:#ffc8d4}
.columns :is(.row,.walletResult) .projectBadge.author{border-color:transparent;background:linear-gradient(#202939,#202939) padding-box,linear-gradient(105deg,#508eff,#dce5ee,#508eff) border-box;background-size:100% 100%,200% 100%;animation:projectBadgeGlow 5s ease-in-out infinite alternate}
.columns :is(.row,.walletResult) .projectBadge.joystick{--badge-edge:#9164ac}
.columns :is(.row,.walletResult) .projectBadge.phoenix{--badge-edge:#a86a36}
.projectBadge.joystick span,.projectBadge.phoenix span{background:linear-gradient(90deg,var(--badge-color),#ffe182,var(--badge-color));background-size:210% 100%;background-clip:text;color:transparent;animation:projectBadgeGlow 5s ease-in-out infinite alternate}
.projectBadge.joystick{--badge-color:#e3a6ff}
.projectBadge.phoenix{--badge-color:#ff9862}
@keyframes projectBadgeGlow{to{background-position:100% 0}}

.filterPanel{background:#0f2033;border:1px solid #355573;padding:14px;border-radius:14px;margin:0 0 14px}

.filterBadgesHeading{display:flex;align-items:center;justify-content:space-between;gap:9px;
 border-top:1px solid #2b4961;padding-top:13px;margin-top:4px}

#clearBadgeFilters{border:0;background:none;color:#88cfff;text-decoration:underline;font-size:12px;padding:6px}
.badgeFilterSearch{display:block;width:100%;min-width:0;min-height:42px;margin:9px 0 12px;
 padding:9px 12px;border:1px solid #3c5d7e;border-radius:10px;background:#0b182a;

.badgeFilterList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badgeFilterItem{display:flex;align-items:center;gap:8px;min-height:39px;padding:7px 9px;

.filterHint{margin:12px 0 0;font-size:12px;color:#93aec5;line-height:1.5}
#feed{display:grid;gap:13px;margin-top:14px}
/* A transaction is a standalone, readable card rather than a compressed table row. */
#feed .operationRow{display:flex;flex-direction:column;align-items:stretch;gap:11px;position:relative;
 padding:16px 17px!important;margin:0;min-width:0;overflow:hidden;border:1px solid #344e67;
 border-left:4px solid #486787!important;border-radius:16px;background:#172b3d!important;
 box-shadow:0 5px 15px #030c172d;isolation:isolate}
#feed .operationRow.trade-buy{border-left-color:#45d9a2!important;background:linear-gradient(110deg,#153b35,#152d39 50%,#142637)!important}
#feed .operationRow.trade-sell{border-left-color:#ff7a8c!important;background:linear-gradient(110deg,#3a2636,#262837 55%,#1b2636)!important}
#feed .operationRow>div{position:relative;z-index:1;min-width:0}
#feed .operationRow .opHeader{display:flex;align-items:center;justify-content:space-between;gap:9px}
#feed .operationRow .opKind{font-weight:780;letter-spacing:-.015em;font-size:15px;line-height:1.3}
#feed .operationRow .opKind.buy{color:#7ef0c0}
#feed .operationRow .opKind.sell{color:#ffadba}
#feed .operationRow .opKind.burn{color:#ffe1a0}
#feed .operationRow .opDate{font-size:11px;color:#adc4da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
#feed .operationRow .opToggle{display:grid!important;place-items:center;flex:0 0 35px;width:35px;min-height:35px;
 color:#d3e6f6;background:#1c3852;border:1px solid #436380;border-radius:10px;padding:0}
#feed .operationRow .opToggle span{display:block;width:auto;height:auto;border:0;
 transform:none;color:inherit;font:750 23px/1 system-ui,sans-serif}
#feed .operationRow .opToggle[aria-expanded="true"] span{transform:rotate(180deg)}
#feed .operationRow .opAmounts{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
 gap:12px;align-items:start;width:100%}
#feed .operationRow .opAmounts>div{min-width:0;display:flex;flex-direction:column;gap:2px}
#feed .operationRow .opAmountValue{display:block;overflow-wrap:anywhere;
 color:#f5faff;font-size:clamp(18px,2.2vw,24px);font-weight:795;letter-spacing:-.028em;
 line-height:1.22;font-variant-numeric:tabular-nums}
#feed .operationRow .opAmountUnit{color:#a6c1d7;font-size:12px;font-weight:650;line-height:1.4}
#feed .operationRow .opGram{text-align:right;align-items:flex-end}
#feed .operationRow .opWallet{padding-top:10px;border-top:1px solid #ffffff20;font-size:14px}
#feed .operationRow .walletIdentity{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;width:100%;max-width:100%}
#feed .operationRow .walletAddress{font-weight:720;text-decoration-thickness:1px;text-underline-offset:3px;
 max-width:100%;overflow-wrap:anywhere}
#feed .operationRow .domainBadge.digits{vertical-align:middle;flex:0 0 auto}
#feed .operationRow .projectBadges{display:flex;flex-wrap:wrap;width:100%;gap:6px;margin-top:5px}
#feed .operationRow .opMobile{display:none;gap:10px;justify-content:space-between;
 padding-top:10px;border-top:1px solid #ffffff20;font-size:12px;color:#afc2d5}
#feed .operationRow .opMobile:not([hidden]){display:flex!important;grid-column:auto;text-align:left}
#feed .operationRow .opMobile a{color:#8cd5ff;font-weight:700}
#feed .operationRow .opDesktop{display:none!important}
#feed .operationRow .projectBadge{min-height:28px}
#feed .operationRow .domainDetails{max-width:100%;width:auto}
/* Burn decorations cover the whole card; text remains fully legible above them. */
#feed .operationRow.trade-burn{
 border:2px solid #d47b45!important;border-left:4px solid #ffba45!important;
 background:linear-gradient(120deg,#4a1a1a,#733319,#4d1c28,#783b18,#401d22)!important;
 background-size:300% 300%!important;
 animation:observatoryFireGlow 7s ease-in-out infinite alternate;
 box-shadow:0 0 17px #fa5c242b,inset 0 0 20px #ffae2520}
#feed .operationRow.trade-burn::before{content:"🔥  🔥     🔥  🔥";position:absolute;inset:auto 0 -12px;
 text-align:center;font-size:36px;letter-spacing:8px;opacity:.19;pointer-events:none;
 filter:blur(1px);animation:observatoryFlames 4.4s ease-in-out infinite alternate;z-index:0}
#feed .operationRow.trade-burn .opAmountValue{color:#fff5e8}
@keyframes observatoryFireGlow{
 0%{background-position:0% 55%;border-color:#b95f34;box-shadow:0 0 14px #eb702c32}
 50%{background-position:70% 12%;border-color:#ffb75a;box-shadow:0 0 24px #fa9a2342}
 100%{background-position:100% 75%;border-color:#db6938;box-shadow:0 0 16px #f4654444}
}
@keyframes observatoryFlames{from{transform:translateY(5px) scale(1);opacity:.10}to{transform:translateY(-15px) scale(1.07);opacity:.28}}
/* Honors apply only to the current top 10 in the appropriate rankings. */
#rank .rankingRow{position:relative;isolation:isolate;overflow:hidden;border-radius:14px;
 border:1px solid #355269;padding:14px 12px;margin-bottom:9px;gap:12px;
 background:#152438;min-width:0}
#rank .rankingRow>div{z-index:1;position:relative;min-width:0}
#rank .rankingRow .walletIdentity{max-width:100%;width:100%}
#rank .rankingRow .projectBadges{width:100%;margin-top:4px}
#rank .rankingRow .rankHonor{display:table;width:max-content;max-width:100%;border-radius:100px;
 font:760 11px/1.4 system-ui,sans-serif;padding:4px 11px;margin:0 0 8px;
 letter-spacing:.03em;text-transform:uppercase}
#rank .rankingRow.diamondHands{border:2px solid transparent;
 background:linear-gradient(#151e33,#192c46) padding-box,
 linear-gradient(115deg,#c2ecff,#dba5ff,#74ffd7,#ffe3a0,#9fb8ff,#e3a8ff,#c2ecff) border-box;
 background-size:100% 100%,350% 350%;animation:diamondSweep 8s linear infinite;
 box-shadow:inset 0 0 18px #99cfff13,0 0 11px #acaaff20}
#rank .diamondHands::before{content:"💎 ✦ 💠 ✧ 💎";position:absolute;inset:auto 2px 1px auto;
 opacity:.22;font-size:24px;pointer-events:none;z-index:0;
 animation:diamondSpark 5s ease-in-out infinite alternate}
#rank .diamondHonor{color:#f8efff;background:linear-gradient(105deg,#634c92,#3b647d,#74613d);
 border:1px solid #d9caff88;text-shadow:0 0 9px #bbaaffaa}
@keyframes diamondSweep{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
@keyframes diamondSpark{from{opacity:.1;transform:translateY(3px)}to{opacity:.30;transform:translateY(-3px)}}
#rank .rankingRow.paperHands{border:2px solid transparent;
 background:linear-gradient(#232431,#1a2637) padding-box,
 linear-gradient(115deg,#f7eee8,#a9b6c8,#e5b3ab,#eee3d8,#a9b6c8) border-box;
 background-size:100% 100%,280% 280%;animation:paperBorder 9s linear infinite}
#rank .paperHands::before{content:"🧻   🧻   🧻   🧻\A 🧻   🧻   🧻   🧻\A 🧻   🧻   🧻   🧻";
 white-space:pre;position:absolute;inset:-12px;z-index:0;font-size:28px;line-height:1.9;
 opacity:.13;pointer-events:none;transform:rotate(-8deg) scale(1.07);animation:paperDrift 8s ease-in-out infinite alternate}
#rank .paperHonor{color:#ecdddd;background:#53424b;border:1px solid #ccbbc7aa}
@keyframes paperBorder{from{background-position:0 0,0% 30%}to{background-position:0 0,100% 60%}}
@keyframes paperDrift{from{transform:rotate(-8deg) translateY(-6px) scale(1.07)}to{transform:rotate(-6deg) translateY(7px) scale(1.07)}}
.serviceEmoji{display:inline-block;margin-right:2px;font-size:15px;line-height:1}
/* Hero places the token emblem beside the identity rather than over the CTA. */
.hero{min-height:295px;display:flex;align-items:center;border-radius:24px}
.heroArt{width:33%;height:100%;right:16px;inset:0 16px 0 auto;background-size:contain;
 background-position:center;filter:drop-shadow(0 6px 20px #62b0ff50)}
.hero .herotext{max-width:65%;padding:30px clamp(23px,3.8vw,49px)}

}

 .feedFilterBar #filters button{flex:1 1 auto;min-width:0;font-size:12px;padding:8px 4px}
 .feedFilterBar #badgeFilterToggle{align-self:flex-end}
 #feed .operationRow{padding:14px 13px!important}
 #feed .operationRow .opAmounts{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
 #feed .operationRow .opAmountValue{font-size:clamp(17px,4.6vw,21px)}
 #feed .operationRow .opDate{font-size:10px}
 #rank .rankingRow{padding:11px 10px}
 .hero{min-height:285px;display:block}
 .hero .herotext{max-width:100%;padding:22px 18px}
 .hero h1{font-size:clamp(30px,7.6vw,42px);max-width:calc(100% - 115px);min-height:78px}

/* OBSERVATORY OPERATION CARDS V1.1 — no per-card expansion, direct explorer action. */
#feed .operationRow .opHeader{align-items:center;gap:12px}

 display:inline-flex;position:relative;z-index:2;align-self:flex-end;justify-content:center;align-items:center;

/* JURY OBSERVATORY v1.2 — mobile-first polish, compact trades and per-DEX identity. */
html{scroll-behavior:smooth}
#market,#activity,#wallets,#pools,#supply,#links{scroll-margin-top:150px}
#market{background:linear-gradient(162deg,#111c30,#152238 80%)!important}
.summary{background:linear-gradient(150deg,#142139,#192b45)!important;border-color:#34496b}
#activity{background:linear-gradient(157deg,#17273a,#1b3046)!important}
#wallets{background:linear-gradient(157deg,#192b40,#203753)!important}
#pools{background:linear-gradient(157deg,#1c3047,#23405a)!important}
#supply{background:linear-gradient(157deg,#20384f,#29475f)!important}
#links{background:linear-gradient(157deg,#243f55,#2d4f68)!important}
#activity,#wallets,#pools,#supply,#links{border-color:#3b536e}
#nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;min-width:0}
#nav a{flex:0 0 auto;white-space:nowrap;padding:10px 9px;font-size:12px;text-align:center}
#nav a[href="#links"]{font-size:12px}
#nav a[href="#links"]::after{content:none!important}
#feed{gap:9px}
#feed .operationRow{padding:11px 13px!important;gap:7px;box-shadow:0 2px 8px #030b1724;border-radius:13px}
#feed .operationRow .opHeader{min-height:25px}
#feed .operationRow .opTitleGroup{display:flex;align-items:center;gap:10px;min-width:0}
#feed .operationRow .opKind{font-size:14px}
#feed .operationRow .opDate{font-size:11px;color:#adbed2}
#feed .operationRow .opAmounts{gap:7px}
#feed .operationRow .opAmountValue{font-size:clamp(17px,2vw,21px);line-height:1.17}
#feed .operationRow .opAmountUnit{font-size:11px}
#feed .operationRow .opFooter{display:grid;grid-template-columns:minmax(0,1fr) auto;
 gap:10px;align-items:start;padding-top:8px;border-top:1px solid #ffffff20}
#feed .operationRow .opWallet{padding:0;border:0;min-width:0;font-size:12px}
#feed .operationRow .walletIdentity{column-gap:4px;row-gap:4px}
#feed .operationRow .walletAddress{font-size:12px;line-height:1.55;overflow-wrap:anywhere}
#feed .operationRow .projectBadges{gap:4px;margin-top:4px}
#feed .operationRow .opTransaction,
#feed .operationRow .opTransaction:hover{display:inline!important;align-self:start;
 margin:1px 0 0;padding:0;min-height:0;max-width:100%;
 background:none;border:0;border-radius:0;font-weight:650;font-size:12px;
 line-height:1.6;color:#a7ddff;text-decoration:underline;text-decoration-color:#6aa4d0;
 text-underline-offset:3px;white-space:nowrap}
#feed .operationRow .opTransaction::after{content:none!important;display:none!important}
#feed .operationRow .opTransaction:focus-visible{outline:2px solid #bbe8ff;outline-offset:3px}
#feed .operationRow .trendMini{width:52px;height:28px;flex:0 0 auto;overflow:visible}
#feed .operationRow .trendLine{fill:none;stroke-width:2.7;stroke-linecap:round;
 stroke-linejoin:round;stroke-dasharray:75;stroke-dashoffset:75;
 animation:trendDraw 3.3s ease-in-out infinite}
#feed .operationRow .trend-buy{color:#56ebac}
#feed .operationRow .trend-sell{color:#ff899d}
#feed .operationRow .trendLine{stroke:currentColor}
#feed .operationRow .trendDot{fill:currentColor;animation:trendDotPulse 3.3s ease-in-out infinite}
@keyframes trendDraw{0%,8%{stroke-dashoffset:75;opacity:.3}40%,83%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:75;opacity:.3}}
@keyframes trendDotPulse{0%,25%{opacity:0}55%,84%{opacity:1}100%{opacity:0}}
/* Animate Diamond Hands name/domain and honor in addition to the animated border. */

#rank .diamondHands .rankHonor,
#rank .diamondHands .domainBadge{
 color:#e7dcff;background-image:linear-gradient(105deg,#f8fbff,#92e9ff,#f3b6ff,#ffe4a6,#b4ffd9,#e2d5ff);

#rank .diamondHands .domainBadge{box-shadow:inset 0 0 10px #cbb6ff44,0 0 7px #88baff22}
@keyframes gemLetters{0%{background-position:0% 50%}100%{background-position:100% 50%}}
#rank .rankingRow .serviceGear{display:inline-flex;align-items:center;justify-content:center;

.brandGlyph.brand-ston{background:#19458a;color:#bfe7ff;border-color:#4ca6e9}
.brandGlyph.brand-dedust{background:#5b4615;color:#ffe58c;border-color:#c59b31}
.brandGlyph.brand-tonco{background:#175c47;color:#a7ffd8;border-color:#40b98f}
.brandGlyph.brand-ton,.brandGlyph.brand-gram{background:#1b5a89;color:#e6f7ff;border-color:#49a5ea}
.brandGlyph.brand-gecko{background:#306040;color:#ecffb3;border-color:#87ba65}
.brandGlyph.brand-kito{background:#3a2854;color:#eddcff;border-color:#8660c0}
.brandGlyph.brand-usdt{background:#17664e;color:#a7fbe0;border-color:#41be8d}
.brandGlyph.brand-tonraffles,.brandGlyph.brand-jvault{background:#394576;border-color:#849bd2;color:#e7e9ff}
.brandedLink{display:inline-flex!important;gap:7px;align-items:center;justify-content:center}
#pools .poolCard h3{display:flex;gap:5px;align-items:center;flex-wrap:wrap;line-height:1.4}
#pools .poolCard .brandGlyph{width:19px;height:19px;flex-basis:19px;font-size:9px}
#pools .poolCard{position:relative;overflow:hidden;border-left-width:4px;
 transition:border-color .18s,background .18s,transform .18s}
#pools .poolCard.dex-dedust{background:linear-gradient(145deg,#3f371c,#2e3341)!important;
 border-color:#8b783a;border-left-color:#edc452;color:#fff4d3}
#pools .poolCard.dex-ston{background:linear-gradient(145deg,#1b365d,#243248)!important;
 border-color:#4679b7;border-left-color:#5abaff;color:#d9f0ff}
#pools .poolCard.dex-tonco{background:linear-gradient(145deg,#1c4b3c,#253b45)!important;
 border-color:#4d987a;border-left-color:#64dcad;color:#e0fff1}
#pools .poolCard.dex-mixed{background:linear-gradient(125deg,#403a28,#233e56)!important;
 border-color:#607791;border-left-color:#a1c9b0}
#pools .poolCard:not([class*="dex-"]){border-left:4px solid #617d97}
#pools .poolLiquidity{font-weight:750;color:#d5f3ed!important}
/* Money comes from market-cap estimation and current locked/staked source totals. */
#supply .supplyGrid a{display:flex;flex-direction:column;gap:5px;background:#1b2d42;
 border-color:#4a617d;padding:14px;border-radius:13px;min-width:0}
#supply .supplyGrid strong{font-size:clamp(16px,2vw,20px);line-height:1.25;overflow-wrap:anywhere}
#supply .supplyGrid .supplyUsd{color:#98e9c5;font-size:14px;font-weight:700}
#supply .supplyGrid small:not(.supplyUsd){color:#bbd0e2}
@media(max-width:1000px){
 #nav{justify-content:space-between;grid-column:1/-1;gap:2px}
 #nav a{flex:1 1 auto;min-width:0;padding:9px 5px;font-size:12px}
}
@media(max-width:590px){
 #nav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;
 gap:4px;width:100%;overflow:visible!important}
 #nav a{font-size:11px;min-height:36px;line-height:1.1;padding:7px 3px;white-space:normal}
 #market,#activity,#wallets,#pools,#supply,#links{scroll-margin-top:175px}
 #feed .operationRow{padding:10px 11px!important;gap:6px}
 #feed .operationRow .opFooter{gap:8px}
 #feed .operationRow .opTitleGroup{gap:7px}
 #feed .operationRow .trendMini{width:40px;height:22px}
 #feed .operationRow .opDate{font-size:10px}
 #feed .operationRow .opTransaction{font-size:11px!important}
 #feed .operationRow .opAmountValue{font-size:clamp(16px,4.25vw,20px)}
 #pools .poolCard{padding:12px}
 #supply .supplyGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 #supply .supplyGrid strong{font-size:15px}
}
@media(max-width:360px){
 #supply .supplyGrid{grid-template-columns:1fr}
 #nav a{font-size:10.5px}
 #feed .operationRow .opAmounts{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
 #feed .operationRow .opAmountValue{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
 #feed .operationRow .trendLine,#feed .operationRow .trendDot,
 #rank .diamondHands .walletAddress,#rank .diamondHands .rankHonor,
 #rank .diamondHands .domainBadge{animation:none!important}
 #feed .operationRow .trendLine{stroke-dashoffset:0}
 #feed .operationRow .trendDot{opacity:1}
}


/* Contrast and alignment fixes from the real mobile screenshots. */
#feed .operationRow .trendBase{fill:none;stroke:currentColor;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round;opacity:.32}
#rank .rankingRow .walletIdentity.serviceWallet{display:flex;flex-wrap:wrap;
 align-items:flex-start;gap:4px 7px;min-width:0}
#rank .rankingRow .walletIdentity.serviceWallet > .walletAddress{
 flex:1 1 0;min-width:0;overflow-wrap:anywhere}
#rank .rankingRow .walletIdentity.serviceWallet > .serviceGear{
 flex:0 0 23px;margin-top:1px}
#rank .rankingRow .walletIdentity.serviceWallet > .projectBadges{
 flex:1 0 100%}
#rank .rankingRow .diamondHonor{font-size:10px!important;padding:4px 7px!important;
 white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

/* Observatory icon pack — local verified vector logos (offline only). */
.brandGlyph img{display:block;width:18px;height:18px;object-fit:contain;filter:brightness(0) invert(1)}
.brandGlyph.brand-github img{width:17px;height:17px}
/* Owner-approved flags and token emblems retain full color (SVG glyphs still use existing fallback styles). */
.brandGlyph.hasApprovedArtwork,.brandMark.hasApprovedArtwork{background-image:none!important}
.brandGlyph.hasApprovedArtwork{background:transparent!important;border-color:transparent!important;box-shadow:none;padding:0;overflow:visible}
.brandGlyph .brandTile,.brandMark .brandTile{display:block;width:100%;height:100%;flex:none;background-repeat:no-repeat;pointer-events:none}
.brandGlyph .brandTile{border-radius:4px}
.brandMark.hasApprovedArtwork{display:inline-flex;overflow:hidden}
.brandMark .brandTile{border-radius:50%}
.brandGlyph.brand-kito.hasApprovedArtwork{background:#d4e2f3!important;border:1px solid #92b1d7!important;border-radius:5px}

/* Compact, full-color DEX emblems in trading-pool descriptions. */
#pools .poolCard .dexMarks{display:inline-flex;align-items:center;vertical-align:middle;gap:3px;margin-right:2px}
#pools .poolCard .dexMarks .brandGlyph{width:17px;height:17px;min-width:17px;flex:0 0 17px;border-radius:4px}

/* Wallet-service logos belong to the guide, without changing the identity badges. */
#wallets .badgeLegend dt .brandGlyph{width:17px;height:17px;min-width:17px;flex:0 0 17px;vertical-align:middle;margin-right:4px}

/* JURY 2026 UX revision — approved icons, trading semantics and mobile polish. */
.brandInline{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;white-space:nowrap}
.heroChain,.marketChain{display:flex;align-items:center;flex-wrap:wrap;column-gap:7px;row-gap:7px}
.brandInline .brandGlyph{width:27px;height:27px;min-width:27px;flex:0 0 27px;border-radius:6px}
.heroChain .brandGlyph,.marketChain .brandGlyph{width:29px;height:29px;min-width:29px;flex-basis:29px}
.dexTag{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.dexTag .brandGlyph{width:24px;height:24px;min-width:24px;flex-basis:24px}
.brandGlyph{width:28px;height:28px;min-width:28px;flex:0 0 28px;font-size:12px}
.brandGlyph img{width:23px;height:23px;object-fit:contain}
.brandGlyph svg{width:21px;height:21px}
.brandGlyph .brandTile{border-radius:5px}
#pools .poolCard h3 .brandGlyph{width:26px;height:26px;min-width:26px;flex:0 0 26px}
#pools .poolCard .dexMarks .brandGlyph{width:23px;height:23px;min-width:23px;flex:0 0 23px}
#pools .poolActions a{display:inline-flex;gap:8px;align-items:center;flex-wrap:nowrap}
#pools .poolActions a .brandGlyph{width:24px;height:24px;min-width:24px;flex:0 0 24px}
.introLinks a{gap:8px}
.introLinks a .brandGlyph{width:27px;height:27px;min-width:27px;flex:0 0 27px}
.hero .introLinks a[href^="https:"]::after{content:none!important;display:none!important}
#links .resourceList{display:flex!important;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:9px}
#links .resourceList>a,#links .resourceList>button{
  display:inline-flex;align-items:center;justify-content:flex-start;gap:9px;
  flex:0 1 auto;width:max-content;max-width:100%;min-height:48px;
  padding:9px 12px;font-size:clamp(13px,1.5vw,15px);line-height:1.25;
  overflow-wrap:anywhere;text-align:left
}
#links .resourceList>a .brandGlyph{width:30px;height:30px;min-width:30px;flex:0 0 30px}
#links .resourceList>a::after{content:none!important;display:none!important}
#links .resourcesGrid article{min-width:0}
#links #contractAddress{font-size:12px;overflow-wrap:anywhere}
#supply .supplyGrid a .brandGlyph{width:27px;height:27px;min-width:27px;flex:0 0 27px}
#stats .statHeading{
 display:flex;align-items:center;gap:9px;min-width:0;min-height:28px;
 border:0;background:none;padding:0;color:#d7e8f9;
 font-weight:750;line-height:1.3;white-space:normal
}
#stats .statHeading.buy{color:#81eac0}
#stats .statHeading.sell{color:#ffacb4}
#stats .statHeading.burn{color:#ffcb88}
#stats .statHeading .trendMini{width:41px;height:22px}
#stats .statHeading .statFire{font-size:22px;line-height:1;display:inline-block;
 transform-origin:50% 90%;animation:statFireFlicker 1.8s ease-in-out infinite alternate}
@keyframes statFireFlicker{
 0%{transform:rotate(-8deg) scale(.92);filter:brightness(.92)}
 55%{transform:rotate(5deg) scale(1.15);filter:brightness(1.15)}
 100%{transform:rotate(-2deg) scale(1.02);filter:brightness(1.3)}
}
.trendMini{width:45px;height:24px;flex:0 0 auto;overflow:visible}
.trendMini.trend-buy{color:#56ebac}
.trendMini.trend-sell{color:#ff899d}
.trendMini .trendBase,.trendMini .trendLine,.trendMini .trendArrow{
 fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round
}
.trendMini .trendBase{stroke-width:1.9;opacity:.27}
.trendMini .trendLine{stroke-width:2.6;stroke-dasharray:75;stroke-dashoffset:75;
 animation:trendDraw 3.3s ease-in-out infinite}
.trendMini .trendArrow{stroke-width:2.9;opacity:0;
 animation:trendArrowReveal 3.3s ease-in-out infinite}
@keyframes trendArrowReveal{
 0%,25%{opacity:0;stroke-dasharray:20;stroke-dashoffset:20}
 43%,83%{opacity:1;stroke-dasharray:20;stroke-dashoffset:0}
 100%{opacity:0;stroke-dashoffset:20}
}
#feed .operationRow{position:relative;isolation:isolate;overflow:hidden}
#feed .operationRow .operationWatermark{
 position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);
 grid-template-rows:repeat(2,1fr);align-items:center;justify-items:center;
 pointer-events:none;z-index:0;transform:rotate(-12deg) scale(1.06);opacity:.18
}
#feed .operationRow .operationWatermark .brandGlyph{
 display:block;width:46px;height:46px;min-width:46px;flex:none;
 border:0;border-radius:7px;background:none;box-shadow:none;
}
#feed .operationRow .operationWatermark .brandTile{border-radius:7px}
#feed .operationRow >:not(.operationWatermark){position:relative;z-index:1}
#feed .operationRow .trendMini{width:43px;height:23px}
#rank .rankingRow.bestSellers{
 position:relative;isolation:isolate;overflow:hidden;border:2px solid transparent;
 background:linear-gradient(#192d3a,#192d3a) padding-box,
 linear-gradient(105deg,#247986,#82d7b1,#5472c6,#247986) border-box;
 background-size:100% 100%,330% 330%;animation:bestSellerBorder 9s linear infinite
}
#rank .rankingRow.bestSellers::before{
 content:"⇄  ↗   ⇄  ↘   ↗   ⇄   ↘   ⇄   ↗   ⇄";
 position:absolute;inset:0;overflow:hidden;word-break:break-all;
 font:750 23px/1.8 system-ui,sans-serif;letter-spacing:17px;
 color:#80decd;opacity:.13;pointer-events:none;
 transform:rotate(-8deg) scale(1.12);
 animation:bestSellerFlow 8s ease-in-out infinite alternate;
 z-index:0
}
#rank .rankingRow.bestSellers > div{position:relative;z-index:1;min-width:0}
#rank .bestHonor{
 color:#dffff7;background:linear-gradient(115deg,#115467,#20634a);
 border:1px solid #82d7b1a8;font-weight:800;white-space:nowrap
}
@keyframes bestSellerBorder{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
@keyframes bestSellerFlow{from{transform:rotate(-8deg) translateX(-9px) scale(1.12)}to{transform:rotate(-8deg) translateX(11px) scale(1.12)}}
#views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
#views button{min-width:0;padding:10px 5px;white-space:normal;line-height:1.3}
#wallets .badgeLegend dl{grid-template-columns:minmax(94px,auto) 1fr;gap:8px 10px}
#wallets .badgeLegend dt{display:flex;align-items:center;gap:6px;min-width:0}
#wallets .badgeLegend dt .badgePreview{
 display:inline-flex;align-items:center;justify-content:center;
 flex:0 0 auto;min-width:31px;min-height:28px;
 padding:3px 5px;margin:0;overflow:visible
}
#wallets .badgeLegend dt .badgePreview img{width:23px;height:23px;object-fit:contain}
#wallets .badgeLegend dt .badgePreview .beerIcon{width:24px;height:24px}
#wallets .badgeLegend dt .brandGlyph{width:24px;height:24px;min-width:24px;flex:0 0 24px}
@media(max-width:590px){
 #nav a{min-height:45px;line-height:1.2;padding:7px 4px;font-size:10.5px}
 .marketChain{font-size:10.5px;column-gap:5px}
 .heroChain .brandGlyph,.marketChain .brandGlyph{width:24px;height:24px;min-width:24px;flex-basis:24px}
 #activity .sectionHeading{display:flex;flex-wrap:wrap;gap:8px}
 .dexTag{font-size:12px}
 #stats .statHeading{gap:5px;font-size:12px}
 #stats .statHeading .trendMini{width:32px;height:18px}
 #feed .operationRow .trendMini{width:37px;height:20px}
 #links .resourcesGrid{grid-template-columns:minmax(0,1fr)}
 #links .resourceList>a,#links .resourceList>button{font-size:13px;padding:8px 10px;min-height:46px}
 #wallets .badgeLegend dl{grid-template-columns:minmax(86px,auto) minmax(0,1fr);gap:8px}
 #wallets .badgeLegend dt{font-size:11px;flex-wrap:wrap}
 #wallets .badgeLegend dt .badgePreview{min-width:29px}
 #views button{font-size:11px;padding:9px 3px}
}
@media(prefers-reduced-motion:reduce){
 #stats .statFire,.trendMini .trendLine,.trendMini .trendArrow,
 #rank .rankingRow.bestSellers,#rank .rankingRow.bestSellers::before{animation:none!important}
 .trendMini .trendLine{stroke-dashoffset:0!important}
 .trendMini .trendArrow{opacity:1!important;stroke-dashoffset:0!important}
}

html[lang="ru"] #supply [lang="en"], html[lang="en"] #supply [lang="ru"]{display:none!important}

/* Token symbol is private to the newly generated project, not the common flags. */
.brandGlyph.brand-project{background:var(--project-flag) center/contain no-repeat!important;
 border-color:transparent!important;box-shadow:none!important;
 color:transparent!important;font-size:0!important;padding:0!important}
.supplyExternal{display:flex;flex-wrap:wrap;margin-top:14px;gap:9px}
.supplyExternal a{display:inline-flex;align-items:center;gap:8px;
 text-decoration:none;color:#eff8ff;border:1px solid #567296;
 background:#132447;border-radius:10px;padding:9px 12px;min-height:42px}
.supplyExternal a:hover{border-color:#81bdff}
html[lang="en"] .supplyExternal [lang="ru"],
html[lang="ru"] .supplyExternal [lang="en"]{display:none!important}

/* Project-specific badges (both static WebP and animated WebP/GIF). */
#wallets .badgeLegend dt[data-project-badge] {display:flex;gap:8px;align-items:center}

#wallets .badgeLegend dt[data-project-badge] img {width:26px;height:26px;object-fit:contain}
html[lang="en"] .customBadgeDescription [lang="ru"] {display:none!important}
html[lang="ru"] .customBadgeDescription [lang="en"] {display:none!important}
.projectBadge.customBadge {display:inline-flex;gap:5px;align-items:center;
  color:#f0f8ff;background:linear-gradient(120deg,#172b40,#23435a);
  border:1px solid var(--badge-accent,#76bfff);border-radius:9px;
  padding:3px 7px;min-height:25px}
#badgeFilterList .badgeFilterItem img {width:22px;height:22px;object-fit:contain;flex:0 0 22px}
.projectBadge.customBadge img {width:23px;height:23px;object-fit:contain;
  animation:customBadgeFloat 2.8s ease-in-out infinite alternate}
.projectBadge.customBadge .customBadgeSymbol {font-size:12px;font-weight:850;
  color:var(--badge-accent,#76bfff);min-width:20px;text-align:center}
@keyframes customBadgeFloat {from{transform:translateY(1px) scale(.95)}
 to{transform:translateY(-1px) scale(1.05)}}
@media(prefers-reduced-motion:reduce) {
 .projectBadge.customBadge img {animation:none!important}
}

function rawLookupAddress(value){

   if(!wallet){
     const query=input.toLowerCase();
     const cached=Object.keys(snapshot.identity?.byWallet||{}).find(key=>linkedDomain(key)===query)
       || (snapshot.holders?.asOf>=Date.now()/1000-day ? snapshot.holders.holders.find(row=>row.name===query)?.wallet : null);
     try{
       const record=await lookupData("/dns/"+encodeURIComponent(query)+"/resolve",controller.signal);
       wallet=rawLookupAddress(record?.wallet?.address||"");
     }catch(error){ if(!cached)throw error; wallet=cached; }
     if(!wallet){
       if(lookupPending===controller)lookupResult={status:"walletDomainMissing"};
       return;
     }
     name=query;
   }
   const account="/accounts/"+encodeURIComponent(wallet);
   const [jetton,nfts]=await Promise.allSettled([
     lookupData(account+"/jettons/"+MASTER,controller.signal),
     lookupData(account+"/nfts?"+new URLSearchParams({collection:fragmentCollection,limit:100}),controller.signal)
   ]);
   const record=jetton.value;
   const items=nfts.value?.nft_items;
   if(Array.isArray(items)){
     const ownsNumber=items.some(item=>item.verified===true && item.collection?.address===fragmentCollection &&
       item.owner?.address===wallet && wallet!=="0:"+"0".repeat(64));
     if(ownsNumber || items.length<100)ownsFragment=ownsNumber;
   }
   if(record&&rawLookupAddress(record.jetton?.address||"")===rawLookupAddress(MASTER)&&/^\d+$/.test(record.balance)){
     const decimals=Number(record.jetton.decimals);
     if(Number.isInteger(decimals)&&decimals>=0&&decimals<=30)balance=Number(record.balance)/10**decimals;
   }
 }catch{
   if(!wallet){
     if(lookupPending===controller)lookupResult={status:"walletNetwork"};
     return;
   }
 }finally{
   clearTimeout(timeout);
   if(lookupPending===controller){
     if(wallet)lookupResult={wallet,name,balance,ownsFragment};
     renderLookup();
   }
 }
}

function renderPools(){
  const section=snapshot.pools;
  const grid=$("discoveredPools");
  grid.replaceChildren();
  const labels={
    pool:"Пул", analytics:"Аналитика", contract:"Контракт", liquidity:"Ликвидность", checked:"Проверено по GeckoTerminal"
  };
  const english={pool:"Pool", analytics:"Analytics", contract:"Contract", liquidity:"Liquidity", checked:"Checked via GeckoTerminal"};
  const words=lang==="ru"?labels:english;
  $("poolChecked").textContent="";
  const indexed=new Map((section?.rows||[]).map(pool=>[rawLookupAddress(pool.address),pool]));
  for(const card of document.querySelectorAll("#pools .knownPools .poolCard")){
    card.querySelector(".poolLiquidity")?.remove();
    const entries=[];
    for(const anchor of card.querySelectorAll("a")){
      const url=new URL(anchor.href);
      if(url.hostname!=="www.geckoterminal.com" && url.hostname!=="gram.org")continue;
      const address=rawLookupAddress(url.pathname.split("/").pop());
      const pool=indexed.get(address);
      if(!pool)continue;
      indexed.delete(address);
      if(pool.liquidityUsd!=null)entries.push("$"+format(pool.liquidityUsd,2));
    }
    if(entries.length)card.append(el("p",words.liquidity+" · "+entries.join(" / "),"poolLiquidity"));
  }
  for(const pool of indexed.values()){
    const address=rawLookupAddress(pool.address);
    if(!address)continue;
    const card=el("article",undefined,"poolCard");card.dataset.quoteAddress=pool.token;
    card.append(el("h3","JURY / "+pool.symbol),el("p",pool.dex));
    const actions=el("div",undefined,"poolActions");
    const dex=/dedust/i.test(pool.dex)?"dedust":/ston/i.test(pool.dex)?"ston":null;
    if(dex)actions.append(link("https://"+(dex==="dedust"?"dedust.io":"app.ston.fi")+"/pools/"+encodeURIComponent(pool.address),words.pool));
    actions.append(link("https://www.geckoterminal.com/ton/pools/"+encodeURIComponent(pool.address),words.analytics),
      link("https://gram.org/address/"+encodeURIComponent(pool.address),words.contract));
    card.append(actions);
    if(pool.liquidityUsd!=null)card.append(el("p",words.liquidity+" · $"+format(pool.liquidityUsd,2),"poolLiquidity"));
    grid.append(card);
  }
  grid.hidden=!grid.childElementCount;
  const hasPools=grid.childElementCount>0||document.querySelector("#pools .knownPools .poolCard")!==null;
  document.querySelector("#pools .poolIntro").hidden=hasPools;
  $("poolChecked").hidden=!$("poolChecked").textContent;
}
function renderSupply(){
  const frozen=snapshot.vesting?.reserved;
  const principal=snapshot.staking?.principal;
  const available=frozen!=null||principal!=null;
  $("supply").hidden=!available;
  document.querySelector('#nav a[href="#supply"]').hidden=!available;
  if(!available)return;
  const estimate=marketCapSeries(snapshot,30*day,60,"USD");
  const supply=Number(snapshot.holders?.totalSupply);
  const latest=estimate.latest;
  const valid=Number.isFinite(estimate.latestCap)&&estimate.latestCap>0
    &&Number.isFinite(supply)&&supply>0
    &&latest?.time && snapshot.trades?.asOf-latest.time<=2*day;
  const price=valid?estimate.latestCap/supply:null;
  for(const [amount,totalId,usdId] of [
    [frozen,"frozenTotal","frozenUsd"],[principal,"stakingTotal","stakingUsd"]]){
    const units=Number(amount);
    $(totalId).textContent=amount==null?"—":format(units)+" JURY";
    const usd=price!=null&&Number.isFinite(units)&&units>=0?units*price:null;
    $(usdId).textContent=usd===null?"—":"≈ $"+format(usd)+" USD";
    $(usdId).title=t("supplyUsdHint");
  }
}

function renderSyncStatus(){
 const ru=lang==='ru', now=Date.now()/1000;
 const required=['trades','holders'];const times=required.map(k=>snapshot[k]?.asOf).filter(n=>Number.isFinite(n)&&n>0);const missingSections=required.some(k=>!snapshot[k]?.asOf);
 const asOf=times.length?Math.min(...times):0, minutes=asOf?Math.max(0,Math.floor((now-asOf)/60)):0;
 let age=minutes<1?(ru?'только что':'just now'):minutes<60?(ru?`${minutes} мин. назад`:`${minutes} min ago`):(ru?`${Math.floor(minutes/60)} ч ${minutes%60} мин. назад`:`${Math.floor(minutes/60)}h ${minutes%60}m ago`);
 const fresh=asOf?(missingSections?(ru?'Доступные данные обновлены '+age:'Available data updated '+age):(ru?'Данные обновлены '+age:'Data updated '+age)):(ru?'Нет полного снимка данных':'Complete snapshot unavailable');
 const loading=syncState.phase==='loading', failed=syncState.phase==='error';
 $('syncStatus').textContent=loading?(ru?'Проверяем обновления…':'Checking for updates…'):failed?(ru?'Не удалось загрузить свежие данные':'Could not load fresh data'):fresh;
 const warning=!asOf || missingSections || minutes>=60 || (snapshot.errors||[]).length>0;
 $('syncStatus').className=failed||warning?'syncWarning':'';
 let detail=loading||failed?fresh:minutes>=60?(ru?'Данные обновляются с задержкой.':'Data refresh is delayed.'):(missingSections||(snapshot.errors||[]).length>0)?(ru?'Некоторые разделы пока не проиндексированы.':'Some sections have not been indexed yet.'):(ru?'Автопроверка каждые 5 минут':'Checks every 5 minutes');
 if(failed) detail+=' · '+(ru?'Показана сохранённая копия. Повторим проверку автоматически.':'Showing the saved copy. We will retry automatically.');
 if(syncState.checkedAt&&!loading&&!failed) detail+=' · '+(ru?'Проверено в ':'Checked at ')+new Date(syncState.checkedAt).toLocaleTimeString(lang,{hour:'2-digit',minute:'2-digit'});
 const labels=ru?{holders:"Холдеры",trades:"Операции / график",burns:"Сжигания",pools:"Пулы",domains:"Домены"}:{holders:"Holders",trades:"Trades / chart",burns:"Burns",pools:"Pools",domains:"Domains"};
 $('sectionStatusTitle').textContent=ru?'Актуальность разделов':'Section freshness';
 $('sectionStatusRows').replaceChildren(...Object.entries(labels).map(([key,label])=>{
   const part=snapshot[key],unavailable=(snapshot.errors||[]).includes(key);
   return el('p',label+': '+(part?.asOf?stamp(part.asOf):(ru?'нет данных':'unavailable'))+(unavailable?(ru?' (ошибка обновления)':' (refresh failed)'):''));
 }));
 $('syncDetail').textContent=detail;
 $('syncStatus').title=asOf?stamp(asOf):'';
 $('refreshData').textContent=loading?(ru?'Загрузка…':'Loading…'):(ru?'Обновить':'Refresh');
 $('refreshData').disabled=loading;
}
const refresh=createSnapshotLoader({
 getSnapshot:()=>snapshot,
 applySnapshot:next=>{
  for(const key of ["zeroBurns","identity","fragmentNumbers","pools","vesting","staking"]){
    if(snapshot[key]&&(!next[key]||snapshot[key].asOf>next[key].asOf))next[key]=snapshot[key];
  }
  snapshot=next;
  render();
 },
 onState:state=>{syncState={...syncState,...state};renderSyncStatus()}
});
$('refreshData').onclick=()=>refresh();
refresh();
setInterval(()=>{if(!document.hidden)refresh()},300000);
setInterval(renderSyncStatus,60000);

const jumps=Array.from(document.querySelectorAll("#nav a"));
function activeSection(){
 const y=window.scrollY+Math.min(window.innerHeight*.35,220);
 const narrow=window.matchMedia("(max-width:800px)").matches;
 const hash=window.location.hash;
 let target=jumps[0];
 for(const jump of jumps){
   const section=document.querySelector(jump.hash);
   if(jump.hidden||section.hidden)continue;
   if(section.offsetTop>y)continue;
   if(!narrow&&jump.hash==="#wallets"&&hash!=="#wallets")continue;
   target=jump;
 }
 for(const jump of jumps){
   jump.classList.toggle("on",jump===target);
   if(jump===target)jump.setAttribute("aria-current","location");else jump.removeAttribute("aria-current");
 }
}
window.addEventListener("scroll",activeSection,{passive:true});
window.addEventListener("hashchange",activeSection);
activeSection();
